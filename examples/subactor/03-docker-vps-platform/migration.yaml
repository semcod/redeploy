# 03 — Docker VPS Platform + portal (documented target topology)
# Usage:
#   export SUBACTOR_VPS_SSH=deploy@YOUR_IP
#   # edit host below or substitute
#   redeploy run examples/subactor/03-docker-vps-platform/migration.yaml --plan-only
#   redeploy run examples/subactor/03-docker-vps-platform/migration.yaml --dry-run
#
# Canonical Subactor scripts (authority remains there):
#   www-sub-actor/scripts/deploy-all.sh
#   www-sub-actor/scripts/release.sh
#   platform/scripts/deploy-stack.sh
#
# Preconditions: host fits subactor.host/production-server/v1;
# pinned components.lock; secrets on host; PORTAL_IMAGE=ghcr.io/...:sha-*

name: "subactor docker VPS — platform + portal (pinned)"
description: >-
  SSH surface for pinned deploy-all.sh. Placeholders only — set host and image
  before dry-run/apply.

source:
  strategy: docker_full
  host: "deploy@SUBACTOR_VPS_IP"
  app: www-sub-actor
  version: "sha-PREVIOUS"
  domain: sub.actor
  remote_dir: /opt/subactor

target:
  strategy: docker_full
  host: "deploy@SUBACTOR_VPS_IP"
  app: www-sub-actor
  version: "sha-COMMIT"
  domain: sub.actor
  remote_dir: /opt/subactor
  compose_files:
    - www-sub-actor/docker-compose.yml
  env_file: /opt/subactor/www-sub-actor/.env
  verify_url: https://sub.actor/readyz
  verify_version: "sha-COMMIT"

extra_steps:
  - id: forbid_plesk_compose_reminder
    action: ssh_cmd
    description: "Assert operator intent — Compose must not run inside shared Plesk"
    command: >-
      echo "POLICY: FORBID RUN_COMPOSE_STACK_INSIDE_PLESK";
      echo "POLICY: FORBID BIND_CONTROL_PORT_8181_PUBLIC";
      echo "Control only via https://control.sub.actor"
    risk: low
    insert_before: sync_env

  - id: deploy_all_pinned
    action: ssh_cmd
    description: "Run canonical deploy-all.sh with pinned portal image"
    command: >-
      test -n "${PORTAL_IMAGE:-}" || { echo "Set PORTAL_IMAGE=ghcr.io/subactor/www-sub-actor:sha-COMMIT"; exit 2; };
      cd /opt/subactor/www-sub-actor &&
      CONTAINER_ENGINE=docker PORTAL_IMAGE="$PORTAL_IMAGE"
      ./scripts/deploy-all.sh docker "$PORTAL_IMAGE"
    risk: high
    timeout: 3600

  - id: smoke_readyz
    action: ssh_cmd
    description: "Portal readyz"
    command: >-
      curl -fsS --max-time 30 https://sub.actor/readyz && echo readyz-ok
    risk: low
    rollback_on_failure: false

notes:
  - "Do not copy developer .env to production without audit"
  - "GitHub release path: release.sh over SSH — secrets stay on host"
  - "Backup Postgres, acme-data, Platform volumes before apply"
  - "RPi5 is a different fleet device — never use this migration for full Platform on Pi"
