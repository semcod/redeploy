# 01 — Plesk edge verify (read-only documentation surface)
# Usage: redeploy run examples/subactor/01-plesk-edge-verify/migration.yaml --plan-only
#
# Mutating Plesk publish stays in Subactor (plesk:// + deployment bindings).
# Hosts below are placeholders; verify steps are local curl from the planner.

name: "subactor plesk-edge verify (public pages)"
description: >-
  Read-only EQL probes for live Plesk-hosted Subactor surfaces.
  Does not sync docroots.

source:
  strategy: docker_full
  host: "operator@localhost"
  app: subactor-edge
  version: "live"
  domain: subactor.com
  remote_dir: /tmp/subactor-redeploy-noop

target:
  strategy: docker_full
  host: "operator@localhost"
  app: subactor-edge
  version: "live"
  domain: subactor.com
  remote_dir: /tmp/subactor-redeploy-noop
  verify_url: https://subactor.com/
  verify_version: "live"

extra_steps:
  - id: eql_subactor_com
    action: ssh_cmd
    description: "EQL marketing root responds"
    command: >-
      curl -fsS -o /dev/null -w '%{http_code}\n' --max-time 20 https://subactor.com/
      | grep -E '^(200|301|302)$'
    risk: low

  - id: eql_auth_bootstrap
    action: ssh_cmd
    description: "auth.subactor.com bootstrap is reachable (static, not full IdP)"
    command: >-
      curl -fsS -o /dev/null -w '%{http_code}\n' --max-time 20 https://auth.subactor.com/
      | grep -E '^(200|301|302)$'
    risk: low

  - id: eql_sub_actor
    action: ssh_cmd
    description: "sub.actor responds (live path may still be Plesk httpdocs)"
    command: >-
      curl -fsS -o /dev/null -w '%{http_code}\n' --max-time 20 https://sub.actor/
      | grep -E '^(200|301|302|401|403)$'
    risk: low

notes:
  - "SSOT bindings: subactor/platform/config/deployment-bindings/registry.v1.json"
  - "auth.subactor.com is informational bootstrap — not production OIDC yet"
  - "Prefer --plan-only until hosts are intentionally set for dry-run"
