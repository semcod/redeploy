# 02 — Founder public origin verify
# Usage: redeploy run examples/subactor/02-founder-origin-verify/migration.yaml --plan-only
#
# Architecture (live 2026-08-15):
#   Internet → founder.subactor.com (Plesk TLS + Node)
#     → 127.0.0.1:19081 ← SSH -R from Lenovo
#       → Caddy :18081 → hr-control

name: "subactor founder.subactor.com origin verify"
description: >-
  Read-only EQL for Founder public origin. Does not restart the tunnel unit.

source:
  strategy: docker_full
  host: "operator@LENOVO_LAB"
  app: founder-origin
  version: "live"
  domain: founder.subactor.com
  remote_dir: /tmp/subactor-redeploy-noop

target:
  strategy: docker_full
  host: "operator@LENOVO_LAB"
  app: founder-origin
  version: "live"
  domain: founder.subactor.com
  remote_dir: /tmp/subactor-redeploy-noop
  verify_url: https://founder.subactor.com/__origin_health
  verify_version: "live"

extra_steps:
  - id: eql_founder_root_unauthorized
    action: ssh_cmd
    description: "GET / without credentials must be 401 Basic"
    command: >-
      code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://founder.subactor.com/);
      test "$code" = "401" && echo founder-root-401-ok
    risk: low

  - id: eql_founder_form
    action: ssh_cmd
    description: "GET /founder/form returns Founder HTML"
    command: >-
      curl -fsS --max-time 20 https://founder.subactor.com/founder/form
      | grep -q 'Subactor' && echo founder-form-ok
    risk: low

  - id: eql_origin_health
    action: ssh_cmd
    description: "Origin health JSON endpoint"
    command: >-
      curl -fsS --max-time 20 https://founder.subactor.com/__origin_health
      | grep -qi . && echo origin-health-ok
    risk: low

  - id: hint_tunnel_unit
    action: ssh_cmd
    description: "Remind operator to check user systemd tunnel on Lenovo"
    command: >-
      echo "Check: systemctl --user status founder-plesk-tunnel.service";
      echo "Script: platform/scripts/founder-plesk-tunnel.sh"
    risk: low

notes:
  - "Project docs: subactor/projekty/founder-subactor-com/README.md"
  - "Without tunnel, proxied paths return 502"
  - "Target cutover: https://control.sub.actor/founder after Docker VPS is live"
