# Subactor fleet inventory (roles only — no secrets)
# Usage: redeploy fleet --file examples/subactor/fleet.yaml
#
# Replace ssh_host placeholders before targeting a live device.
# Plesk edge is verify-only from the operator workstation (ssh_host empty).

devices:
  - id: plesk-edge-subactor
    name: "Plesk edge — *.subactor.com + current sub.actor publish"
    arch: amd64
    strategy: docker_full
    ssh_host: ""
    remote_dir: ""
    version: "edge-live"
    domain: "subactor.com"
    stage: prod
    tags: [prod, plesk, edge, subactor, verify-only]
    expectations:
      - https_reachable
    color: "#64748b"
    notes: "Provider=plesk via Subactor deployment-bindings; redeploy does not SFTP here."

  - id: founder-origin-tunnel
    name: "Founder public origin (Plesk Node + Lenovo tunnel)"
    arch: amd64
    strategy: docker_full
    ssh_host: "operator@LENOVO_LAB"
    remote_dir: ""
    version: "founder-live"
    domain: "founder.subactor.com"
    stage: prod
    tags: [prod, founder, tunnel, subactor, verify-only]
    expectations:
      - ssh_reachable
      - https_reachable
    color: "#f59e0b"
    notes: "systemd --user founder-plesk-tunnel.service on Lenovo."

  - id: docker-vps-platform
    name: "Docker VPS — Platform + www-sub-actor (target topology)"
    arch: amd64
    strategy: docker_full
    ssh_host: "deploy@SUBACTOR_VPS_IP"
    remote_dir: "/opt/subactor"
    version: "sha-PINNED"
    env_file: "envs/subactor-vps.env"
    domain: "sub.actor"
    compose_files:
      - "src/platform/docker-compose.yml"
      - "src/platform/docker-compose.production.yml"
    apps: [platform, www-sub-actor]
    stage: prod
    tags: [prod, vps, docker, platform, portal, subactor]
    expectations:
      - has_docker
      - has_docker_compose
      - ssh_reachable
      - https_reachable
      - no_k3s
    color: "#10b981"
    notes: "FORBID shared Plesk Docker; Control only via control.sub.actor router."

  - id: rpi5-portal-edge
    name: "RPi5 portal edge / lab (not full Platform)"
    arch: arm64
    strategy: docker_full
    ssh_host: "pi@RPI5_IP"
    remote_dir: "/opt/www-sub-actor"
    version: "sha-PINNED"
    domain: "portal.edge.example"
    stage: lab
    tags: [lab, rpi5, arm64, portal, subactor]
    expectations:
      - has_docker
      - ssh_reachable
    color: "#3b82f6"
    notes: "Policy subactor.host/rpi5/v1 — FORBID full Platform production."
